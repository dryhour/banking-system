<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        const token = localStorage.getItem('sessionToken');
        if (!token) {
            window.location.href = 'userlogin.html';
        } else {
            fetch('/verify?token=' + token)
                .then(r => r.text())
                .then(data => {
                    if (data === 'invalid') {
                        localStorage.removeItem('sessionToken');
                        window.location.href = 'userlogin.html';
                    } else {
                        const [username, user_type] = data.split('&');
                        if (user_type === 'user') {
                            document.querySelector('header h2').textContent = `(Logged in as ${username})`;
                        } else {
                            window.location.href = 'userlogin.html';
                        }
                    }
                });
        }
        </script>
